---

- name: touch semaphore for Jenkins
  file:
    path: /tmp/ansible_complete
    owner: root
    group: root
    mode: 0644
    state: touch

# For Shibboleth, which does not recommend SELinux
- name: Put SELinux in permissive mode
  selinux:
    policy: targeted
    state: permissive

- name: Fin
  debug:
    msg: '##### END ANSIBLE ROLE #####'
